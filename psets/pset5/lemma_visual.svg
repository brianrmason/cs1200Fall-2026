<svg xmlns="http://www.w3.org/2000/svg" width="860" height="660" viewBox="0 0 860 660" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="860" height="660" fill="#ffffff"/>

  <!-- ================= TITLE ================= -->
  <text x="430" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111">The Lemma, visually: BFS organizes vertices into levels (rings)</text>
  <text x="430" y="58" text-anchor="middle" font-size="15" fill="#555">Each column = how many steps a vertex is from the depot s. These columns are the frontiers F₀, F₁, F₂, F₃.</text>

  <!-- column guides -->
  <g stroke="#e3e3e3" stroke-width="1">
    <line x1="210" y1="80" x2="210" y2="300"/>
    <line x1="390" y1="80" x2="390" y2="300"/>
    <line x1="570" y1="80" x2="570" y2="300"/>
  </g>
  <!-- column headers -->
  <g font-size="14" fill="#333" text-anchor="middle" font-weight="600">
    <text x="110" y="100">0 steps</text><text x="110" y="118" font-weight="400" fill="#888" font-size="12.5">F₀ = {s}</text>
    <text x="300" y="100">1 step</text><text x="300" y="118" font-weight="400" fill="#888" font-size="12.5">F₁</text>
    <text x="480" y="100">2 steps</text><text x="480" y="118" font-weight="400" fill="#888" font-size="12.5">F₂  ← here is u</text>
    <text x="680" y="100">3 steps</text><text x="680" y="118" font-weight="400" fill="#888" font-size="12.5">F₃  ← here is v</text>
  </g>

  <!-- ===== PANEL A: the shortest path ===== -->
  <text x="40" y="160" font-size="15" font-weight="700" fill="#111">What the lemma says:</text>

  <!-- arrowhead defs -->
  <defs>
    <marker id="gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#9aa0a6"/></marker>
    <marker id="green" markerWidth="12" markerHeight="12" refX="8" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 Z" fill="#1e8e3e"/></marker>
    <marker id="red" markerWidth="12" markerHeight="12" refX="8" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 Z" fill="#c5221f"/></marker>
  </defs>

  <!-- edges of the shortest path s -> a -> u -> v -->
  <line x1="138" y1="210" x2="272" y2="210" stroke="#9aa0a6" stroke-width="2.5" marker-end="url(#gray)"/>
  <line x1="328" y1="210" x2="452" y2="210" stroke="#9aa0a6" stroke-width="2.5" marker-end="url(#gray)"/>
  <line x1="508" y1="210" x2="652" y2="210" stroke="#1e8e3e" stroke-width="4" marker-end="url(#green)"/>

  <!-- nodes -->
  <g>
    <circle cx="110" cy="210" r="26" fill="#111" stroke="#111"/><text x="110" y="216" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">s</text>
    <circle cx="300" cy="210" r="24" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="2"/><text x="300" y="216" text-anchor="middle" font-size="16" fill="#555">a</text>
    <circle cx="480" cy="210" r="27" fill="#d2e3fc" stroke="#1a73e8" stroke-width="3"/><text x="480" y="216" text-anchor="middle" font-size="18" font-weight="700" fill="#1a3d8f">u</text>
    <circle cx="680" cy="210" r="27" fill="#fce8e6" stroke="#c5221f" stroke-width="3"/><text x="680" y="216" text-anchor="middle" font-size="18" font-weight="700" fill="#8a1a17">v</text>
  </g>

  <!-- green edge label -->
  <text x="588" y="192" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e8e3e">the edge (u,v)</text>
  <text x="588" y="248" text-anchor="middle" font-size="12.5" fill="#1e8e3e">the scan finds this</text>

  <text x="40" y="285" font-size="14" fill="#444">A shortest route to v (3 steps) is s → a → u → v. The stop just before v is <tspan font-weight="700" fill="#1a3d8f">u</tspan>, sitting one column back, in <tspan font-weight="700">F₂</tspan>.</text>

  <!-- divider -->
  <line x1="40" y1="330" x2="820" y2="330" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- ===== PANEL B: why u can't be closer ===== -->
  <text x="40" y="372" font-size="15" font-weight="700" fill="#111">Why u can't be any closer than 2 steps:</text>

  <!-- nodes: s, fake u' in F1, v in F3 -->
  <line x1="138" y1="470" x2="272" y2="470" stroke="#c5221f" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#red)"/>
  <path d="M322,470 C 430,430 560,430 652,466" fill="none" stroke="#c5221f" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#red)"/>

  <circle cx="110" cy="470" r="26" fill="#111"/><text x="110" y="476" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">s</text>
  <circle cx="300" cy="470" r="25" fill="#fde7e9" stroke="#c5221f" stroke-width="2.5" stroke-dasharray="4 3"/><text x="300" y="469" text-anchor="middle" font-size="15" font-weight="700" fill="#8a1a17">u?</text>
  <text x="300" y="484" text-anchor="middle" font-size="10.5" fill="#8a1a17">(1 step)</text>
  <circle cx="680" cy="470" r="27" fill="#fce8e6" stroke="#c5221f" stroke-width="3"/><text x="680" y="476" text-anchor="middle" font-size="18" font-weight="700" fill="#8a1a17">v</text>

  <text x="487" y="418" text-anchor="middle" font-size="13.5" font-weight="700" fill="#c5221f">shortcut: s → u? → v = only 2 steps</text>
  <text x="430" y="520" text-anchor="middle" font-size="14" fill="#444">If u were only 1 step from s, then s → u? → v would reach v in <tspan font-weight="700" fill="#c5221f">2 steps</tspan> —</text>
  <text x="430" y="540" text-anchor="middle" font-size="14" fill="#444">but v is <tspan font-weight="700">3 steps</tspan> away. Contradiction. So u <tspan font-weight="700">cannot</tspan> be closer than 2 steps.</text>

  <!-- conclusion box -->
  <rect x="120" y="574" width="620" height="56" rx="10" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5"/>
  <text x="430" y="598" text-anchor="middle" font-size="14" fill="#145a2a"><tspan font-weight="700">Conclusion:</tspan> u is at most 2 steps (one back on the route) and at least 2 steps (no shortcut),</text>
  <text x="430" y="618" text-anchor="middle" font-size="14" fill="#145a2a">so u is <tspan font-weight="700">exactly 2 steps</tspan> from s — it lives in F₂ and has an edge straight into v. ∎</text>
</svg>
